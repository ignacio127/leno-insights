name: Actualizar Dashboard LENO

on:
  schedule:
    - cron: '0 8,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular periodos (mes actual y mes anterior)
        id: periodos
        run: |
          MESES=(Enero Febrero Marzo Abril Mayo Junio Julio Agosto Septiembre Octubre Noviembre Diciembre)
          HOY=$(date +%Y-%m-%d)
          ANIO_ACT=$(date +%Y); MES_ACT=$(date +%-m)
          PERIODO_ACT=${MESES[$((MES_ACT-1))]}
          DESDE_ACT="${ANIO_ACT}-$(printf '%02d' $MES_ACT)-01"
          HASTA_ACT="$HOY"
          PRIMER_DIA_ACT="${ANIO_ACT}-$(printf '%02d' $MES_ACT)-01"
          HASTA_ANT=$(date -d "$PRIMER_DIA_ACT -1 day" +%Y-%m-%d)
          DESDE_ANT=$(date -d "$HASTA_ANT" +%Y-%m-01)
          MES_ANT=$(date -d "$HASTA_ANT" +%-m)
          PERIODO_ANT=${MESES[$((MES_ANT-1))]}
          echo "periodo_act=$PERIODO_ACT" >> "$GITHUB_OUTPUT"
          echo "desde_act=$DESDE_ACT"     >> "$GITHUB_OUTPUT"
          echo "hasta_act=$HASTA_ACT"     >> "$GITHUB_OUTPUT"
          echo "periodo_ant=$PERIODO_ANT" >> "$GITHUB_OUTPUT"
          echo "desde_ant=$DESDE_ANT"     >> "$GITHUB_OUTPUT"
          echo "hasta_ant=$HASTA_ANT"     >> "$GITHUB_OUTPUT"
          echo "Mes anterior: $PERIODO_ANT ($DESDE_ANT -> $HASTA_ANT)"
          echo "Mes actual:   $PERIODO_ACT ($DESDE_ACT -> $HASTA_ACT)"

      - name: Correr ingestor
        env:
          GESDATTA_EMAIL: ${{ secrets.GESDATTA_EMAIL }}
          GESDATTA_PASSWORD: ${{ secrets.GESDATTA_PASSWORD }}
        run: |
          # CORRECCIÓN 26/07/2026: ingestor.py ya corre build.py internamente al
          # final de main() salvo que se le pase --no-build (ver ingestor.py
          # línea ~1352). Sin este flag, build.py se ejecutaba DOS veces acá
          # adentro (una vez por cada período) de forma implícita, y una tercera
          # vez con el paso explícito de abajo -- redundante y poco visible.
          # Con --no-build dejamos que el paso "Reconstruir dashboard" sea el
          # único punto donde se genera index.html, ya con ambos períodos
          # actualizados.
          python ingestor.py --desde ${{ steps.periodos.outputs.desde_ant }} --hasta ${{ steps.periodos.outputs.hasta_ant }} --periodo ${{ steps.periodos.outputs.periodo_ant }} --no-build
          python ingestor.py --desde ${{ steps.periodos.outputs.desde_act }} --hasta ${{ steps.periodos.outputs.hasta_act }} --periodo ${{ steps.periodos.outputs.periodo_act }} --no-build

      - name: Reconstruir dashboard (build.py)
        # CORRECCIÓN 26/07/2026 (autocrítica de auditoría): en la corrida anterior
        # de este análisis afirmé que el workflow NUNCA ejecutaba build.py y que el
        # dashboard publicado estaba congelado. Eso fue un error de auditoría: no
        # revisé el final de ingestor.py, que sí llama a build.py automáticamente
        # (subprocess) salvo que se pase --no-build. Verificado con test aislado:
        # el sitio publicado en Pages muy probablemente SÍ se actualizaba en cada
        # corrida, porque "Preparar carpeta para publicar" copiaba el index.html
        # ya reconstruido en el paso "Correr ingestor".
        # El problema REAL (confirmado) es otro: ese index.html reconstruido nunca
        # se commiteaba de vuelta al repo (el paso de git solo agregaba
        # master.json) -- por eso el archivo *versionado en git* seguía
        # mostrando "Julio 1-3" semanas después, aunque lo publicado en Pages
        # probablemente ya reflejara datos frescos. Este paso ahora es explícito
        # y único (los dos "ingestor.py" de arriba corren con --no-build), y el
        # siguiente paso sí commitea index.html junto con master.json para que
        # el repo deje de estar desincronizado de lo publicado.
        run: |
          python build.py

      - name: Guardar master.json e index.html actualizados en el repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master.json index.html
          if git diff --staged --quiet; then
            echo "Sin cambios en master.json/index.html, nada para commitear."
            exit 0
          fi
          git commit -m "data: actualizar master.json + index.html $(date +%Y-%m-%d)"

          intentos=0; maximo=3
          while [ $intentos -lt $maximo ]; do
            intentos=$((intentos+1))
            if git push; then
              echo "Push OK (intento $intentos/$maximo)."
              exit 0
            fi
            echo "Push rechazado (intento $intentos/$maximo) — el remoto tiene commits que no teníamos al arrancar (por ej. alguien subió código mientras corría el workflow). Reintentando con rebase..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "ERROR: conflicto real de contenido al rebasear (no es solo una carrera de commits) — no reintento más. Revisar a mano."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "ERROR: no se pudo pushear master.json/index.html después de $maximo intentos."
          echo "El dashboard SÍ se va a publicar con los datos de esta corrida (siguen en el runner, index.html ya fue reconstruido) — lo que queda pendiente es el commit al repo, que se sincroniza solo en la próxima corrida que logre pushear."
          exit 1

      - name: Preparar carpeta para publicar
        run: |
          mkdir -p public
          cp index.html public/index.html
          printf "User-agent: *\nDisallow: /\n" > public/robots.txt

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
